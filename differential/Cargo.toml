[package]
name = "zentinel-modsec-differential"
version = "0.0.0"
edition = "2021"
publish = false
description = "Development only: @detectSQLi and @detectXSS compared with the C libinjection."

# The engine has no C and no unsafe code. This crate links the C libinjection as an
# oracle for the tests and the fuzz target here, and is not a dependency of anything.

[dependencies]
zentinel-modsec = { path = ".." }

[build-dependencies]
cc = "1"

[dev-dependencies]
percent-encoding = "2.3"
serde = "1"
serde_yaml = "0.9"
walkdir = "2"

# Not a member of a workspace above it.
[workspace]
